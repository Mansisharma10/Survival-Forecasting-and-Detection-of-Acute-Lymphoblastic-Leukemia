<!DOCTYPE html>
<html lang="en">
<head>
  <title>ALL Diagnosis & Survival Forecasting</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4 text-center">ALL Diagnosis & Survival Forecasting</h1>

    <div class="row">
      <div class="col-md-6">
        <h3>Survival Forecasting</h3>
        <form action="/survival" method="post">
          <input class="form-control mb-2" type="number" name="age" placeholder="Age" required>
          <input class="form-control mb-2" type="number" name="wbc" placeholder="WBC Count" step="0.1" required>
          <input class="form-control mb-2" type="number" name="rbc" placeholder="RBC Count" step="0.1" required>
          <input class="form-control mb-2" type="number" name="hgb" placeholder="Hemoglobin" step="0.1" required>
          <input class="form-control mb-2" type="number" name="platelets" placeholder="Platelet Count" required>
          <input class="form-control mb-2" type="number" name="lympho" placeholder="Lymphoblast %" step="0.1" required>
          <select class="form-control mb-2" name="chrom">
            <option value="0">No Chromosomal Abnormalities</option>
            <option value="1">Yes</option>
          </select>
          <button type="submit" class="btn btn-success w-100">Predict Survival</button>
        </form>
      </div>

      <div class="col-md-6">
        <h3>ALL Blood Smear Prediction</h3>
        <form action="/predict" method="post" enctype="multipart/form-data">
          <input class="form-control mb-3" type="file" name="file" accept="image/*" required>
          <button type="submit" class="btn btn-primary w-100">Predict ALL Stage</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
